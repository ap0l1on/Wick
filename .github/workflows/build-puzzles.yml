# Builds public/puzzles.json on GitHub's servers and commits it. Nothing runs on anyone's computer.
# Trigger: any change to data/ or scripts/, every Monday 03:00 UTC, or the "Run workflow" button.
name: Build puzzles
on:
  push:
    branches: [main]
    paths: ['data/puzzles.catalog.json', 'scripts/**']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build-puzzles, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to SHAs (security gate M8). Auditor: verify with `git ls-remote` before launch; Dependabot keeps them fresh.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run test:data
      - run: npm run build:puzzles
      - name: Commit results if they changed
        run: |
          git config user.name  "wick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/puzzles.json data/build-report.md
          git diff --cached --quiet || git commit -m "chore(data): rebuild puzzles [skip ci]"
          git push
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with: { name: build-report, path: data/build-report.md }

# CI on every PR (and push to main): typecheck, tests, production build.
# Data fetching never runs here — only the pure-function tests and the web build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to SHAs (security gate M8). Auditor: verify with `git ls-remote` before launch; Dependabot keeps them fresh.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:data
      - run: npm run test
      - run: npm run build
